name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install optional runtime dependencies
        run: python -m pip install -r 02_Source/requirements-optional.txt
      - name: Run tests
        run: python -m unittest discover -s 06_Tests -v
      - name: Compile source
        run: python -m compileall -q 02_Source
