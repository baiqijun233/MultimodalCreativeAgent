services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TASK_DATABASE_PATH: /data/tasks.db
      ASSET_ROOT: /data/assets
      ARTCLAW_API_KEY_ACCOUNT_A: ${ARTCLAW_API_KEY_ACCOUNT_A:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
    volumes:
      - creative_data:/data
    ports:
      - "127.0.0.1:${API_PORT:-8001}:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build: .
    command: celery -A celery_worker:app worker --loglevel=INFO
    environment:
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      TASK_DATABASE_PATH: /data/tasks.db
      ASSET_ROOT: /data/assets
      ARTCLAW_API_KEY_ACCOUNT_A: ${ARTCLAW_API_KEY_ACCOUNT_A:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
    volumes:
      - creative_data:/data
    depends_on:
      redis:
        condition: service_healthy

volumes:
  creative_data:
